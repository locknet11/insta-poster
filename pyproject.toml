[project]
name = "insta-poster"
version = "0.1.0"
description = "Local webapp, REST API, CLI, and Python SDK for agent-driven Instagram posts & stories from a local image pool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
insta-poster = "insta_poster.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/insta_poster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
